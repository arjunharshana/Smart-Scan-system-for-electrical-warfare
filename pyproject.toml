[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rf-environment"
version = "0.1.0"
description = "Modular simulated RF environment for SIH26055 smart scan strategy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
rf-sim = "rf_environment.app.main:cli_main"

[tool.setuptools.packages.find]
include = ["rf_environment*"]

[tool.setuptools.package-data]
rf_environment = ["scenarios/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
