simulation:
  total_time_steps: 200
  time_step_ms: 10
  seed: 42

spectrum:
  min_frequency_hz: 100000000
  max_frequency_hz: 1000000000

receiver:
  instantaneous_bandwidth_hz: 20000000
  sensitivity_dbm: -90
  noise_floor_dbm: -100
  detection_threshold_db: 6
  tuning_time_ms: 0

detector:
  p_detection: 0.95
  p_false_alarm: 0.02

scheduler:
  type: sequential

emitters:
  - id: E01
    type: radar
    frequency_behavior:
      type: fixed
      frequency_hz: 300000000
    time_behavior:
      type: continuous
    power_dbm: -20
    bandwidth_hz: 2000000

  - id: E02
    type: communication
    frequency_behavior:
      type: hopping
      frequencies_hz: [200000000, 400000000, 600000000]
      mode: sequential
      dwell_steps: 2
    time_behavior:
      type: burst
      burst_duration: 5
      interval: 20
    power_dbm: -30
    bandwidth_hz: 1000000
